name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) 与 package.json 版本($PKG_VERSION) 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint and test
        run: pnpm run check && pnpm test

      - name: Pack tarball
        id: pack
        run: |
          mkdir -p releases
          pnpm pack --pack-destination releases
          TARBALL=$(ls releases/*.tgz | head -n 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"
          echo "packed: $TARBALL"
          node test/artifact-identity.js "$TARBALL"

      - name: Compute checksum
        id: sha
        run: |
          SUM=$(sha256sum "${{ steps.pack.outputs.tarball }}" | cut -d' ' -f1)
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SUM"

      - name: Upload tarball to Release
        if: github.event_name == 'release'
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.pack.outputs.tarball }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append checksum to Release notes
        if: github.event_name == 'release'
        run: |
          EXISTING=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          printf '%s\n\n### Artifact\n\n- `%s`\n- SHA-256: `%s`\n' \
            "$EXISTING" "${{ steps.pack.outputs.filename }}" "${{ steps.sha.outputs.sha256 }}" \
            > notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'release'
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
